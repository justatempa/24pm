name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-24pm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t 24pm:${{ github.sha }} \
            -t 24pm:latest \
            .

      - name: Export image as archive
        run: docker save 24pm:latest | gzip > 24pm-image.tar.gz

      - name: Upload image archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 104.225.159.103
          username: root
          port: 28022
          key: ${{ secrets.SSH_KEY }}
          source: 24pm-image.tar.gz
          target: /tmp

      - name: Load image and restart container on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 104.225.159.103
          username: root
          port: 28022
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail

            APP_NAME="24pm"
            APP_DIR="/opt/24pm"
            IMAGE_ARCHIVE="/tmp/24pm-image.tar.gz"
            PORT=3001

            mkdir -p "$APP_DIR/data"

            OLD_IMAGE_IDS="$(docker images 24pm --format '{{.ID}}' | sort -u)"

            docker load -i "$IMAGE_ARCHIVE"

            if docker ps -a --format '{{.Names}}' | grep -q "^${APP_NAME}$"; then
              docker rm -f "$APP_NAME"
            fi

            # 服务器 libseccomp 过旧(2.3.1)会拦截 SQLite 依赖的 pwritev2 系统调用,
            # 造成 "disk I/O error"(errcode 778);服务器升级系统/ libseccomp 后可去掉此参数
            docker run -d \
              --name "$APP_NAME" \
              --restart unless-stopped \
              --security-opt seccomp=unconfined \
              -p "${PORT}:3000" \
              -v "$APP_DIR/data:/app/data" \
              -e DATA_DIR=/app/data \
              -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              24pm:latest

            rm -f "$IMAGE_ARCHIVE"

            # 冒烟测试:首页 SSR 会触发 SQLite 建库,失败则打印日志并让本次部署判定失败
            for i in 1 2 3 4 5; do
              sleep 2
              if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
                echo "smoke test passed"
                break
              fi
              if [ "$i" = 5 ]; then
                docker logs --tail 100 "$APP_NAME" || true
                echo "smoke test failed: container did not serve / on port ${PORT}" >&2
                exit 1
              fi
            done

            # 每轮部署 load 进一个新镜像,旧的 24pm:<sha> 会一直留在磁盘上,不清理迟早撑满磁盘
            if [ -n "$OLD_IMAGE_IDS" ]; then
              docker rmi $OLD_IMAGE_IDS >/dev/null 2>&1 || true
            fi
            docker image prune -f >/dev/null 2>&1 || true
